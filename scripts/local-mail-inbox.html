<!doctype html>
<html lang="ro">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emailuri locale · Bonie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#16181c;font:15px system-ui,sans-serif}header{padding:22px 24px;border-bottom:1px solid #d9d6cd}h1{margin:0 0 6px;font-size:25px}p{margin:0;color:#4a4f57}input{width:100%;padding:12px;border:1px solid #b4afa2;background:white;font:inherit;margin-top:18px}main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;height:calc(100dvh - 164px);min-height:500px}nav{overflow:auto;border-right:1px solid #d9d6cd}button{font:inherit;cursor:pointer}nav button{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #d9d6cd;background:transparent;padding:18px 24px;overflow-wrap:anywhere}nav button[aria-current=true]{background:#e3ecea;box-shadow:inset 4px 0 #0e4c4a}small{display:block;color:#4a4f57;margin-top:6px}article{padding:24px;min-width:0;overflow:auto}h2{font-size:20px;margin:0 0 12px;overflow-wrap:anywhere}#metadata{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{padding:8px 16px;border:1px solid #b4afa2;background:white}.tabs button[aria-pressed=true]{background:#0e4c4a;color:white}iframe{width:100%;height:65vh;border:1px solid #d9d6cd;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px}#status{font-size:12px;margin-top:8px}button:focus-visible,input:focus-visible{outline:2px solid #0e4c4a;outline-offset:2px}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}nav{max-height:300px;border-bottom:1px solid #d9d6cd}article{padding:20px}}
</style>
<header><h1>Emailuri locale</h1><p>Mesajele rămân pe acest calculator. Nu sunt livrate destinatarilor.</p><label><span class="sr-only">Caută după subiect sau destinatar</span><input id="search" type="search" placeholder="Caută după subiect sau destinatar…"></label><p id="status" role="status">Se încarcă…</p></header>
<main><nav id="list" aria-label="Mesaje capturate"></nav><article aria-label="Conținutul emailului"><h2 id="subject">Selectează un email</h2><p id="metadata"></p><div class="tabs"><button id="html" type="button" aria-pressed="true">HTML</button><button id="text" type="button" aria-pressed="false">Text</button></div><iframe id="preview" title="Previzualizare email" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe><pre id="plain" hidden></pre></article></main>
<script>
const el=id=>document.getElementById(id);let messages=[],selected=null,mode='html';
function show(){const item=messages.find(x=>x.id===selected);if(!item)return;const b=item.body;el('subject').textContent=b.subject||'(Fără subiect)';el('metadata').textContent='Către: '+[].concat(b.to||[]).join(', ')+'\nDe la: '+(b.from||'—')+'\n'+new Date(item.at).toLocaleString('ro-RO');el('plain').textContent=b.text||'(Fără variantă text)';const policy="<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:;\">";el('preview').srcdoc=policy+(b.html||'<pre>Fără variantă HTML. Selectează Text.</pre>');el('preview').hidden=mode!=='html';el('plain').hidden=mode!=='text';el('html').setAttribute('aria-pressed',String(mode==='html'));el('text').setAttribute('aria-pressed',String(mode==='text'));}
function render(){const query=el('search').value.toLocaleLowerCase('ro');el('list').replaceChildren();for(const item of messages){const b=item.body;if(!(b.subject+' '+[].concat(b.to||[]).join(' ')).toLocaleLowerCase('ro').includes(query))continue;const button=document.createElement('button');button.type='button';button.setAttribute('aria-current',String(item.id===selected));const title=document.createElement('strong');title.textContent=b.subject||'(Fără subiect)';const recipient=document.createElement('small');recipient.textContent=[].concat(b.to||[]).join(', ');const date=document.createElement('small');date.textContent=new Date(item.at).toLocaleString('ro-RO');button.append(title,recipient,date);button.onclick=()=>{selected=item.id;render();show()};el('list').append(button)}if(!el('list').children.length){const p=document.createElement('p');p.textContent=messages.length?'Niciun rezultat.':'Niciun email capturat încă.';p.style.padding='24px';el('list').append(p)}}
async function refresh(){try{const response=await fetch('/api/emails',{cache:'no-store'});if(!response.ok)throw Error();const next=await response.json();const changed=JSON.stringify(next)!==JSON.stringify(messages);messages=next;if(!selected&&messages.length)selected=messages[0].id;if(changed){render();show()}el('status').textContent=messages.length+' mesaje · actualizare automată la 3 secunde';if(!messages.length)render()}catch{el('status').textContent='Inboxul nu răspunde. Verifică dacă npm run dev:local este pornit.'}}
el('search').oninput=render;for(const kind of ['html','text'])el(kind).onclick=()=>{mode=kind;show()};refresh();setInterval(refresh,3000);
</script>
</html>
