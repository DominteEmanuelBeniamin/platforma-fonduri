name: Supabase demo migrations

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-demo-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Verify CLI and token format without exposing it
        run: |
          supabase --version
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then echo 'Token missing'; exit 1; fi
          if [[ "$SUPABASE_ACCESS_TOKEN" == sbp_fc* ]]; then echo 'Scoped token present'; elif [[ "$SUPABASE_ACCESS_TOKEN" == sbp_* ]]; then echo 'Other Supabase token present'; else echo 'Unrecognized token prefix'; exit 1; fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEMO_ACCESS_TOKEN }}
      - run: supabase link --project-ref xaqzumvylwkzjlmhrztq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEMO_ACCESS_TOKEN }}
      - name: Verify CIF rollout
        run: supabase db query --remote --file scripts/production-migrations-preflight.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEMO_ACCESS_TOKEN }}
      - run: supabase db push --remote --skip-vault --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEMO_ACCESS_TOKEN }}
